<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
        <h2>Lista de Notas</h2>
        <p>Escribe una nota en el campo de texto y haz clic en "Agregar". Puedes eliminar las notas haciendo clic en su respectivo botón.</p>

        <div class="input-group">
            <input type="text" id="inputNota" placeholder="Escribe tu nota aquí...">
            <button id="btnAgregar">Agregar</button>
        </div>

        <ul id="listaNotas"></ul>
    </main>

    <script src="script.js"></script>
</body>
</html>
